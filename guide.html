<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hướng dẫn Android · Console Translator</title><meta name="description" content="Hướng dẫn Console Translator Android bằng hình: cấp quyền hiện nổi, tải ngôn ngữ, chọn app game và dùng thanh dịch."><meta property="og:title" content="Console Translator Android: hướng dẫn bằng hình"><meta property="og:description" content="5 bước ngắn để bắt đầu dịch game, kèm ảnh và giải thích thanh nổi."><meta property="og:image" content="https://kyozxx.github.io/Console-Translator/assets/guide/01-allow-overlay.png"><style>:root{color-scheme:dark;--bg:#0b0f19;--card:#141c2d;--border:#24324d;--text:#f1f5f9;--muted:#a3b1c6;--blue:#38bdf8;--purple:#a78bfa;--green:#34d399;--orange:#fb923c;--pink:#f472b6}*{box-sizing:border-box}body{margin:0;padding:28px 16px 40px;background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.wrap{max-width:660px;margin:auto}header{text-align:center;margin-bottom:22px}.app-icon{width:88px;height:88px;object-fit:contain;display:block;margin:0 auto 12px}h1{font-size:26px;line-height:1.25;margin:0;font-weight:800;letter-spacing:-.4px}p{margin:8px 0 12px;color:var(--muted)}a{color:var(--blue);text-underline-offset:3px}strong{color:var(--text)}a:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:4px}.tagline{font-size:15px;margin-top:4px}.tg{display:block;text-decoration:none;text-align:center;background:linear-gradient(135deg,#229ed9,#1b7fc4);border-radius:20px;padding:20px 18px;margin-bottom:18px;box-shadow:0 12px 30px -8px #229ed955;color:white}.tg strong{font-size:21px;display:block}.tg span{display:block;color:#e0f2fe;font-size:15px;margin:6px 0 12px}.tg b{display:inline-block;background:white;color:#1b7fc4;padding:10px 24px;border-radius:999px}.overview{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px}.overview a{text-decoration:none;text-align:center;border-radius:12px;padding:10px 4px;background:var(--card);border:1px solid var(--border);font-size:13px;color:var(--muted);min-height:44px}.overview b{display:block;font-size:18px;color:var(--text)}.card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:16px;padding:18px;margin-bottom:16px;scroll-margin-top:16px}.card h2{display:flex;align-items:center;gap:10px;font-size:19px;line-height:1.4;margin:0 0 4px}.why{font-size:14px;margin:0 0 12px}.num{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--bg);font-size:15px;font-weight:800}.s1{--accent:var(--blue)}.s2{--accent:var(--purple)}.s3{--accent:var(--green)}.s4{--accent:var(--orange)}.s5{--accent:var(--pink)}figure{margin:16px auto;max-width:410px}figure.wide{max-width:100%}figure a{display:block;border-radius:12px;overflow:hidden;border:1px solid var(-<div class="box" style="border-color:#fbbf2477;background:#fbbf2414;color:var(--text)"><strong>Đã cài bản Beta cũ?</strong> Hãy chuyển sang bản Google Play để nhận cập nhật tự động. Tham gia <a href="https://groups.google.com/g/console-translator-beta-testers">Google Group</a>, rồi mở <a href="https://play.google.com/apps/testing/com.kyozx.consoletranslator">link Google Play test</a> để cài bản mới.</div><a class="tv-jump" href="https://kyozxx.github.io/PS-Translator/guide.html">Dùng iPhone? Xem hướng dẫn bản iOS →</a><nav class="overview" aria-label="Các bước hướng dẫn"><a href="#step-1"><b>1</b>Cấp quyền</a><a href="#step-2"><b>2</b>Bật quyền</a><a href="#step-3"><b>3</b>Tải gói</a><a href="#step-4"><b>4</b>Chọn app</a><a href="#step-5"><b>5</b>Dịch game</a></nav><a class="tv-jump" href="#remote" style="border-color:#fbbf2477;background:#fbbf2414;font-weight:600">Chơi máy PX5 / PX4: cài app Remote Play trước</a><a class="tv-jump" href="#lg-tv">Cài phụ đề TV LG · PC hoặc Android</a><a class="tv-jump" href="#samsung-tv">Cài phụ đề TV Samsung · PC</a><a class="tv-jump" href="#android-tv">Cài app TV · Mã Downloader &amp; bản Xiaomi</a><p class="caption">Bật phụ đề trong game trước. Nếu chơi qua Remote Play, hãy mở được hình game trên điện thoại.</p><section class="card s4" id="remote"><h2>Chơi máy PX5 / PX4? Cài app Remote Play trước</h2><p class="why">Bắt buộc nếu game chạy trên máy chơi game. Chơi game điện thoại hoặc xem YouTube thì bỏ qua phần này.</p><p>Console Translator chỉ đọc và dịch chữ <strong>đang hiện trên màn hình điện thoại</strong>, không tự kết nối được với máy chơi game. Bạn cần một app Remote Play riêng để đưa hình game về điện thoại.</p><div class="box" style="border-color:#fbbf2477;background:#fbbf2414;color:var(--text)">Đây là app bên ngoài của nhà phát triển khác, <strong>không thuộc Console Translator</strong>. Chúng tôi không làm ra và không hỗ trợ các app này. Bạn chọn app nào cũng được.</div><div class="tv-downloads"><div class="tv-version"><h3>Chiaki-Up</h3><p>Miễn phí · Google Play</p><a class="download-button" style="margin-top:12px" href="https://play.google.com/store/apps/details?id=com.gameblabla.chiaki">Tải Chiaki-Up</a></div><div class="tv-version<a class="download-button" href="https://github.com/kyozxx/PS-Translator/releases/download/lg-mac-1.0.5/ConsoleTranslator-LG-Mac-1.0.5.zip">Tải bộ cài LG cho Mac 1.0.5</a><ol><li>Giải nén ZIP, mở <strong>Chay-Console-Translator.bat</strong>. Nếu thiếu Node.js, bấm <strong>Cài Node.js</strong>, cài bản LTS rồi mở lại.</li><li>Nhập IP và Passphrase 6 ký tự hiện trên TV, bấm <strong>Kết nối TV</strong>. Kiểm tra đúng IP trước khi xác nhận khóa kết nối.</li><li>Nhập <strong>mã LGTV đầy đủ</strong> nhận từ <a href="https://t.me/pstranslator">Telegram</a>, bấm <strong>Cài đặt lên TV</strong>, chờ hoàn tất. Công cụ tự chuẩn bị gói cài.</li></ol><p><strong>Cài bằng Mac:</strong> giải nén ZIP, kéo Console Translator LG vào Applications rồi mở app. Cần macOS 12 trở lên (Intel/Apple Silicon). Nếu thiếu Node.js, bấm <strong>Cài Node.js</strong> ngay trong app và chờ hoàn tất. Nút <strong>Hỗ trợ Telegram</strong> dùng để nhận mã hoặc gửi log. Nhập IP/Passphrase, kết nối TV rồi nhập mã LGTV và cài. Nếu macOS chặn mở, vào Cài đặt hệ thống → Quyền riêng tư &amp; Bảo mật → Vẫn mở với ZIP từ GitHub chính thức.</p><details id="lg-mac-warning"><summary>Mac báo “Console Translator LG chưa được mở”</summary><div style="padding:0 16px 12px"><figure style="max-width:340px;margin:14px auto"><a href="assets/lg-mac-open-warning.png"><img src="assets/lg-mac-open-warning.png" alt="Cảnh báo macOS khi mở Console Translator LG, với nút Xong và Chuyển vào Thùng rác" width="604" height="700" loading="lazy" style="display:block;width:100%;height:auto;border-radius:12px"></a></figure><ol><li>Bấm <strong>Xong</strong> trong cảnh báo. Không chọn Chuyển vào Thùng rác nếu muốn tiếp tục cài.</li><li>Mở <strong>Cài đặt hệ thống → Quyền riêng tư &amp; Bảo mật</strong>, kéo xuống phần <strong>Bảo mật</strong>.</li><li>Tại thông báo chặn Console Translator LG, bấm <strong>Vẫn mở / Open Anyway</strong>. Nhập mật khẩu Mac hoặc dùng Touch ID nếu được hỏi.<figure style="max-width:100%;margin:14px auto"><a href="assets/lg-mac-open-anyway.png"><img src="assets/lg-mac-open-anyway.png" alt="Trong Quyền riêng tư và Bảo mật, bấm nút Vẫn mở cạnh Console Translator LG" width="1578" height="358" loading="lazy" s
